defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

checkpoint:
  epoch_interval: 0
  keep_last_n: 1
  save_final: true
  final_filename: weights.pt
  epoch_dir: epoch_snapshots
  enable_lightning_checkpointing: true

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  directional:
    top_k: 32
    dyn_weight: 0.0
    controllability_weight: 0.0
    reach_weight: 0.0
    nuisance_weight: 0.0
    spectral_pred_weight: 0.0
    residual_band_weight: 0.0
    contact_weight: 0.0
    teacher_anchor_weight: 0.0
    teacher_policy: null
    # Opt-in covariance--predictor geometry intervention. Defaults preserve LeWM.
    alignment_mode: none
    alignment_weight: 0.0
    alignment_bins: 2
    alignment_min_samples: 16
    alignment_ridge: 1e-3
    alignment_conditioning: magnitude
